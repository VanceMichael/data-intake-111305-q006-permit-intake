[project]
name = "permit-intake"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = []

[tool.unittest]
start-directory = "tests"

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["permit_intake", "permit_intake.fixtures"]

[tool.setuptools.package-dir]
"permit_intake.fixtures" = "fixtures"

[tool.setuptools.package-data]
"permit_intake.fixtures" = ["*.json"]
